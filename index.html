<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KEVOS</title>
<meta name="description" content="KEVOS — Kevin's Executive Virtual Operations System" />
<meta name="theme-color" content="#050505" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>:root {
--gold: #d4af37;
--gold-dim: #8a6f1f;
--gold-glow: rgba(212, 175, 55, 0.4);
--gold-cold: #e8e2c8;
--bg: #050505;
--panel-bg: rgba(8, 8, 8, 0.55);
--text: #f2f0e8;
--text-dim: #8a8879;
--line: rgba(212, 175, 55, 0.18);
--danger: #ff5555;
--font-display: 'Orbitron', sans-serif;
--font-body: 'Rajdhani', sans-serif;
--font-mono: 'Share Tech Mono', monospace;
}
* { box-sizing: border-box; }
html, body {
margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
font-family: var(--font-body), sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased;
}
#sphereCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
#sphereCanvas.dragging { cursor: grabbing; }
.spotlight-beam {
position: fixed; top: -10%; left: 50%; width: 140px; height: 140vh;
background: linear-gradient(180deg, rgba(212,175,55,0.22), rgba(212,175,55,0.05) 45%, transparent 80%);
clip-path: polygon(46% 0%, 54% 0%, 100% 100%, 0% 100%);
transform: translateX(-50%) rotate(-6deg);
opacity: 0; pointer-events: none; z-index: 2; mix-blend-mode: screen;
transition: opacity 1.4s ease-in-out, transform 3.5s ease-in-out;
}
.spotlight-beam.on { opacity: 1; }
.wordmark {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
z-index: 3; text-align: center; pointer-events: none;
}
.wordmark__title {
font-family: var(--font-display), sans-serif; font-weight: 900;
font-size: clamp(30px, 6vw, 52px); letter-spacing: 9px; color: var(--gold);
text-shadow: 0 0 10px var(--gold-glow), 0 0 28px var(--gold-glow), 0 0 60px rgba(212,175,55,0.25);
transition: text-shadow 0.15s linear;
}
.wordmark__subtitle {
margin-top: 8px; font-family: var(--font-mono), monospace; font-size: 11px;
letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase;
}
.corner {
position: fixed; z-index: 5; display: flex; gap: 8px;
}
.corner--status { top: 16px; left: 16px; flex-direction: column; align-items: flex-start; gap: 3px; }
.corner--gear { top: 16px; right: 16px; }
.corner--chat { bottom: 16px; left: 16px; flex-direction: column; width: 300px; max-width: calc(100vw - 32px); }
.corner--controls { bottom: 16px; right: 16px; flex-direction: column; align-items: flex-end; gap: 8px; }
.status-line {
font-family: var(--font-mono), monospace; font-size: 11px; letter-spacing: 1px; color: var(--text-dim);
display: flex; align-items: center; gap: 6px;
background: var(--panel-bg); backdrop-filter: blur(6px);
padding: 5px 10px; border-radius: 3px; border: 1px solid var(--line);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px 1px var(--gold-glow); animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
#clock { color: var(--gold); }
.icon-btn {
width: 34px; height: 34px; border-radius: 50%;
background: var(--panel-bg); backdrop-filter: blur(6px);
border: 1px solid var(--gold-dim); color: var(--text-dim);
font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
transition: all 0.15s ease;
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
.icon-btn.active { background: var(--gold); color: #0a0a08; border-color: var(--gold); }
.chat-log {
height: 160px; overflow-y: auto; font-size: 12px; line-height: 1.4;
background: var(--panel-bg); backdrop-filter: blur(6px);
border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin-bottom: 6px;
}
.chat-log::-webkit-scrollbar { width: 4px; }
.chat-log::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }
.logline { margin-bottom: 8px; animation: fade-in 0.2s ease-out; }
@keyframes fade-in { from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);} }
.logline__meta { display:block; font-family: var(--font-mono), monospace; font-size: 9px; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 2px; }
.logline--system .logline__meta { color: var(--gold-dim); }
.logline--user .logline__meta { color: var(--gold); }
.logline--error .logline__meta, .logline--error .logline__body { color: var(--danger); }
.composer { display: flex; gap: 6px; }
.composer__input {
flex: 1; background: var(--panel-bg); backdrop-filter: blur(6px);
border: 1px solid var(--line); color: var(--text); font-family: var(--font-body), sans-serif;
font-size: 13px; padding: 8px 10px; border-radius: 4px; outline: none;
}
.composer__input:focus { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold-glow); }
.composer__send, .composer__mic {
width: 34px; border-radius: 4px; border: 1px solid var(--gold-dim);
background: var(--panel-bg); backdrop-filter: blur(6px); color: var(--text-dim); cursor: pointer;
}
.composer__send:hover, .composer__mic:hover { border-color: var(--gold); color: var(--gold); }
.live-orb {
width: 52px; height: 52px; border-radius: 50%;
background: var(--panel-bg); backdrop-filter: blur(6px);
border: 1px solid var(--gold-dim); color: var(--gold-dim); font-size: 19px; cursor: pointer;
transition: all 0.2s ease;
}
.live-orb:hover { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px var(--gold-glow); }
.live-orb.active { background: var(--gold); color: #0a0a08; border-color: var(--gold); box-shadow: 0 0 20px 4px var(--gold-glow); animation: orb-pulse 1.6s ease-in-out infinite; }
@keyframes orb-pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
.controls-row { display: flex; gap: 8px; }
.settings {
position: fixed; top: 0; right: -320px; width: 300px; height: 100dvh;
background: rgba(6,6,6,0.92); backdrop-filter: blur(10px);
border-left: 1px solid var(--gold-dim); z-index: 20; transition: right 0.25s ease-out;
display: flex; flex-direction: column; overflow-y: auto;
}
.settings.open { right: 0; }
.settings__header {
display: flex; justify-content: space-between; align-items: center;
font-family: var(--font-mono), monospace; font-size: 11px; letter-spacing: 1.5px; color: var(--gold);
padding: 14px 16px; border-bottom: 1px solid var(--line);
}
.settings__close { background: none; border: none; color: var(--text-dim); font-size: 14px; cursor: pointer; }
.settings__close:hover { color: var(--gold); }
.settings__section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.settings__title { font-family: var(--font-mono), monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--gold-dim); margin-bottom: 10px; }
.field { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
.field span:first-child { width: 42px; flex-shrink: 0; }
.field__value { width: 28px; color: var(--gold); font-family: var(--font-mono), monospace; }
.field input[type="range"] { flex: 1; accent-color: var(--gold); }
.field--toggle { justify-content: space-between; }
.field--toggle span:first-child { width: auto; }
.field--toggle input[type="checkbox"] { accent-color: var(--gold); width: 16px; height: 16px; }
.settings__note { font-size: 11px; color: var(--text-dim); line-height: 1.5; margin: 0 0 10px; }
.btn-danger {
width: 100%; font-family: var(--font-mono), monospace; font-size: 10px; letter-spacing: 0.5px;
background: transparent; border: 1px solid var(--danger); color: var(--danger);
padding: 9px 4px; border-radius: 3px; cursor: pointer;
}
.btn-danger:hover { background: rgba(255,85,85,0.12); color: #fff; }
.celebrate-flash {
position: fixed; inset: 0; z-index: 15; pointer-events: none;
background: radial-gradient(circle at 50% 42%, rgba(255,255,255,0.9), rgba(255,255,255,0) 55%);
opacity: 0; animation: flash-burst 1.3s ease-out forwards;
}
@keyframes flash-burst { 0%{opacity:0;} 15%{opacity:1;} 100%{opacity:0;} }
.streak {
position: fixed; z-index: 8; pointer-events: none; height: 2px; width: 160px;
background: linear-gradient(90deg, transparent, var(--gold), transparent);
filter: drop-shadow(0 0 6px var(--gold-glow));
opacity: 0; animation: streak-move linear forwards;
}
@keyframes streak-move {
0% { opacity: 0; transform: translate(var(--sx), var(--sy)) rotate(var(--rot)) scaleX(0.3); }
15% { opacity: 0.9; }
100% { opacity: 0; transform: translate(var(--ex), var(--ey)) rotate(var(--rot)) scaleX(1); }
}
@media (max-width: 640px) {
.corner--chat { width: calc(100vw - 32px); }
.wordmark__title { letter-spacing: 5px; }
}</style>
</head>
<body>
<canvas id="sphereCanvas"></canvas>
<div class="spotlight-beam" id="spotlightBeam"></div>
<div class="wordmark">
<div class="wordmark__title">KEVOS</div>
<div class="wordmark__subtitle" id="heroSubtitle">Kevin's Executive Virtual Operations System</div>
</div>
<div class="corner corner--status">
<div class="status-line"><span class="status-dot"></span><span id="statusText">OPERATIONAL</span></div>
<div class="status-line"><span id="clock">--:--:--</span><span style="opacity:0.4">•</span><span id="linkState">LINK PENDING</span></div>
</div>
<div class="corner corner--gear">
<button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
</div>
<div class="corner corner--chat">
<div class="chat-log" id="feed">
<div class="logline logline--system">
<span class="logline__meta">SYSTEM</span>

</div>
</div>
<form class="composer" id="composer" autocomplete="off">
<button type="button" class="composer__mic" id="micBtn" title="Voice input">🎙</button>
<input id="input" class="composer__input" type="text" placeholder="Message KEVOS..." />

</form>
</div>
<div class="corner corner--controls">
<button class="live-orb" id="liveOrb" title="Start live conversation">🎙</button>
<div class="controls-row">
<button class="icon-btn active" id="voiceOutBtn" title="Voice output on/off">🔊</button>
<button class="icon-btn" id="wakeWordBtn" title="Wake word on/off">👂</button>
<button class="icon-btn" id="resetBtn" title="Clear log">↺</button>
</div>
</div>
<aside class="settings" id="settingsPanel">
<div class="settings__header">
SETTINGS
<button class="settings__close" id="settingsClose">✕</button>
</div>
<div class="settings__section">
<div class="settings__title">VOICE OUTPUT (ElevenLabs)</div>
<label class="field">
<span>Stability</span>
<input type="range" id="stabilitySlider" min="0" max="1" step="0.05" value="0.5" />
<span class="field__value" id="stabilityValue">0.5</span>
</label>
<label class="field">
<span>Clarity</span>
<input type="range" id="claritySlider" min="0" max="1" step="0.05" value="0.75" />
<span class="field__value" id="clarityValue">0.75</span>
</label>
</div>
<div class="settings__section">
<div class="settings__title">DISPLAY</div>
<label class="field field--toggle">
<span>Sphere visual</span>
<input type="checkbox" id="sphereToggle" checked />
</label>
<label class="field field--toggle">
<span>Spotlight beam</span>
<input type="checkbox" id="spotlightToggle" checked />
</label>
</div>
<div class="settings__section">
<div class="settings__title">MEMORY</div>
<p class="settings__note">Clears what KEVOS remembers from your conversations on this device.</p>
<button class="btn-danger" id="clearMemoryBtn">CLEAR MY MEMORY</button>
</div>
</aside>
<script>const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
canvas.width = window.innerWidth * devicePixelRatio;
canvas.height = window.innerHeight * devicePixelRatio;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const POINT_COUNT = 460;
let points = [];
function buildSphere(count) {
points = [];
for (let i = 0; i < count; i++) {
const phi = Math.acos(1 - (2 * (i + 0.5)) / count);
const theta = Math.PI * (1 + Math.sqrt(5)) * i;
points.push({
x0: Math.sin(phi) * Math.cos(theta),
y0: Math.sin(phi) * Math.sin(theta),
z0: Math.cos(phi),
subDots: 4 + Math.floor(Math.random() * 5), // 4-8
});
}
}
buildSphere(POINT_COUNT);
let angleX = 0.3;
let angleY = 0;
let isDragging = false;
let dragLastX = 0, dragLastY = 0;
let userZoom = 1;
canvas.addEventListener('mousedown', (e) => {
isDragging = true;
canvas.classList.add('dragging');
dragLastX = e.clientX; dragLastY = e.clientY;
});
window.addEventListener('mouseup', () => { isDragging = false; canvas.classList.remove('dragging'); });
window.addEventListener('mousemove', (e) => {
if (!isDragging) return;
const dx = e.clientX - dragLastX, dy = e.clientY - dragLastY;
angleY += dx * 0.005;
angleX += dy * 0.005;
dragLastX = e.clientX; dragLastY = e.clientY;
});
canvas.addEventListener('touchstart', (e) => {
isDragging = true;
const t = e.touches[0]; dragLastX = t.clientX; dragLastY = t.clientY;
}, { passive: true });
window.addEventListener('touchend', () => { isDragging = false; });
window.addEventListener('touchmove', (e) => {
if (!isDragging) return;
const t = e.touches[0];
const dx = t.clientX - dragLastX, dy = t.clientY - dragLastY;
angleY += dx * 0.005; angleX += dy * 0.005;
dragLastX = t.clientX; dragLastY = t.clientY;
}, { passive: true });
canvas.addEventListener('wheel', (e) => {
e.preventDefault();
userZoom = Math.min(2.2, Math.max(0.5, userZoom - e.deltaY * 0.0008));
}, { passive: false });
function rotatePoint(x0, y0, z0, ax, ay) {
let y1 = y0 * Math.cos(ax) - z0 * Math.sin(ax);
let z1 = y0 * Math.sin(ax) + z0 * Math.cos(ax);
let x1 = x0;
let x2 = x1 * Math.cos(ay) + z1 * Math.sin(ay);
let z2 = -x1 * Math.sin(ay) + z1 * Math.cos(ay);
let y2 = y1;
return { x: x2, y: y2, z: z2 };
}
const STATE_TARGETS = {
idle:      { radius: 170, spin: 0.0028, glow: 0.55, colorMix: 0.15 },
standby:   { radius: 150, spin: 0.0015, glow: 0.35, colorMix: 0.1 },
listening: { radius: 210, spin: 0.0055, glow: 0.9,  colorMix: 0.25 },
thinking:  { radius: 120, spin: 0.014,  glow: 0.75, colorMix: 0.85 }, // colorMix -> cold white-gold
speaking:  { radius: 185, spin: 0.0042, glow: 0.85, colorMix: 0.2 },
celebrate: { radius: 240, spin: 0.02,   glow: 1.0,  colorMix: 0.3 },
};
let current = { radius: 40, spin: 0.003, glow: 0.9, colorMix: 0.1 }; // starts small -> bursts on load
function lerp(a, b, t) { return a + (b - a) * t; }
function currentState() { return document.body.dataset.state || 'idle'; }
function drawSphere() {
const w = canvas.width, h = canvas.height;
ctx.clearRect(0, 0, w, h);
const target = STATE_TARGETS[currentState()] || STATE_TARGETS.idle;
const lerpSpeed = 0.045;
current.radius = lerp(current.radius, target.radius, lerpSpeed);
current.spin = lerp(current.spin, target.spin, lerpSpeed);
current.glow = lerp(current.glow, target.glow, lerpSpeed);
current.colorMix = lerp(current.colorMix, target.colorMix, lerpSpeed);
let micBoost = 0;
if (currentState() === 'listening' && micAnalyser) micBoost = micVolume() * 0.35;
// Real audio-reactive glow while KEVOS actually talks — analysing the
// ElevenLabs audio as it plays, same technique as the mic above, just on
// the output instead of the input. Genuinely reacts to loudness per word.
let speakBoost = 0;
if (currentState() === 'speaking' && ttsAnalyser) speakBoost = ttsVolume() * 0.55;
if (!isDragging) angleY += current.spin;
const cx = w / 2, cy = h / 2;
const perspective = 480 * devicePixelRatio;
const radiusPx = current.radius * devicePixelRatio * userZoom;
const projected = points.map(p => {
const r = rotatePoint(p.x0 * radiusPx, p.y0 * radiusPx, p.z0 * radiusPx, angleX, angleY);
const scale = perspective / (perspective - r.z);
return { sx: cx + r.x * scale, sy: cy + r.y * scale, z: r.z, scale, subDots: p.subDots };
});
projected.sort((a, b) => a.z - b.z);
const mix = Math.min(1, current.colorMix);
const r = Math.round(lerp(212, 232, mix));
const g = Math.round(lerp(175, 226, mix));
const b = Math.round(lerp(55, 200, mix));
const glowLevel = Math.min(1.4, current.glow + micBoost + speakBoost);
for (const p of projected) {
const depthFactor = Math.min(1, Math.max(0.12, p.scale - 0.5));
const dotSize = (1.1 + depthFactor * 1.8) * devicePixelRatio;
const alpha = Math.min(1, (0.22 + depthFactor * 0.6) * glowLevel);
ctx.shadowBlur = 9 * devicePixelRatio * depthFactor * glowLevel;
ctx.shadowColor = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(2)})`;
for (let i = 0; i < p.subDots; i++) {
const jx = (Math.random() - 0.5) * dotSize * 2.2;
const jy = (Math.random() - 0.5) * dotSize * 2.2;
ctx.beginPath();
ctx.arc(p.sx + jx, p.sy + jy, dotSize * 0.35, 0, Math.PI * 2);
ctx.fill();
}
}
ctx.shadowBlur = 0;
document.querySelector('.wordmark__title').style.textShadow =
`0 0 ${8 + glowLevel * 10}px var(--gold-glow), 0 0 ${20 + glowLevel * 24}px var(--gold-glow), 0 0 ${50 + glowLevel * 30}px rgba(212,175,55,0.25)`;
requestAnimationFrame(drawSphere);
}
requestAnimationFrame(drawSphere);
function setKevosState(state, label) {
document.body.dataset.state = state;
document.getElementById('heroSubtitle').textContent = label || "Kevin's Executive Virtual Operations System";
}
setKevosState('idle');
const spotlightBeam = document.getElementById('spotlightBeam');
let spotlightEnabled = true;
function sweepSpotlight() {
if (!spotlightEnabled) return;
spotlightBeam.style.transform = `translateX(-50%) rotate(${(-10 + Math.random() * 20).toFixed(1)}deg)`;
spotlightBeam.classList.add('on');
setTimeout(() => spotlightBeam.classList.remove('on'), 1200 + Math.random() * 800);
}
setInterval(() => {
const state = currentState();
const chance = state === 'speaking' ? 0.55 : state === 'celebrate' ? 0.9 : 0.06;
if (Math.random() < chance) sweepSpotlight();
}, 1400);
function spawnStreak() {
const streak = document.createElement('div');
streak.className = 'streak';
const fromLeft = Math.random() < 0.5;
const y = `${10 + Math.random() * 70}vh`;
streak.style.setProperty('--sx', fromLeft ? '-10vw' : '110vw');
streak.style.setProperty('--sy', y);
streak.style.setProperty('--ex', fromLeft ? '110vw' : '-10vw');
streak.style.setProperty('--ey', y);
streak.style.setProperty('--rot', `${(Math.random() * 10 - 5).toFixed(1)}deg`);
streak.style.animationDuration = `${0.5 + Math.random() * 0.3}s`;
document.body.appendChild(streak);
setTimeout(() => streak.remove(), 900);
}
function spawnStreakBurst(count) {
for (let i = 0; i < count; i++) {
setTimeout(spawnStreak, i * 90 + Math.random() * 100);
}
}
setTimeout(() => {
current.radius = 340; current.glow = 1.4;
spawnStreakBurst(4);
sweepSpotlight();
}, 300);
function tick() {
document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
}
tick();
setInterval(tick, 1000);
const feed = document.getElementById('feed');
function nowTime() { return new Date().toLocaleTimeString('en-US', { hour12: false }); }
function logLine(kind, text) {
const wrap = document.createElement('div');
wrap.className = `logline logline--${kind}`;
const meta = document.createElement('span');
meta.className = 'logline__meta';
meta.textContent = `${kind === 'user' ? 'YOU' : kind === 'error' ? 'ERROR' : 'SYSTEM'} // ${nowTime()}`;
const body = document.createElement('span');
body.className = 'logline__body';
body.textContent = text;
wrap.appendChild(meta); wrap.appendChild(body);
feed.appendChild(wrap);
feed.scrollTop = feed.scrollHeight;
}
document.getElementById('resetBtn').addEventListener('click', () => {
feed.innerHTML = '';
logLine('system', 'Log cleared.');
});
function getSessionId() {
let id = localStorage.getItem('kevos_session_id');
if (!id) {
id = 'sess_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
localStorage.setItem('kevos_session_id', id);
}
return id;
}
const sessionId = getSessionId();
const KEVOS_BACKEND_URL = 'https://kevos-backend.margohanna333.workers.dev/';
const KEVOS_TTS_URL = KEVOS_BACKEND_URL + 'tts';
const KEVOS_APP_KEY = 'tOSWNvhdUZK7G-xikaFYsM_IXwcduVjS8SnBN9ajouQ';
async function sendToKevos(message) {
if (!KEVOS_BACKEND_URL) return { ok: false, text: 'No backend connected.' };
try {
const res = await fetch(KEVOS_BACKEND_URL, {
method: 'POST', headers: { 'Content-Type': 'application/json', 'x-kevos-key': KEVOS_APP_KEY },
body: JSON.stringify({ message, sessionId }),
});
if (!res.ok) throw new Error(`Backend error: ${res.status}`);
const data = await res.json();
return { ok: true, text: data.reply || '(empty response)' };
} catch (err) {
return { ok: false, text: `Connection failed: ${err.message}` };
}
}
const linkState = document.getElementById('linkState');
if (KEVOS_BACKEND_URL) { linkState.textContent = 'LINK ACTIVE'; linkState.style.color = 'var(--gold)'; }
else { linkState.textContent = 'LINK PENDING'; linkState.style.color = 'var(--danger)'; }
function normalizeSpeech(text) { return text.toLowerCase().replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim(); }
function checkEasterEgg(text) {
if (normalizeSpeech(text).includes('wake up babas home')) { triggerWelcomeHome(); return true; }
return false;
}
function triggerWelcomeHome() {
logLine('system', '🎉 "Wake up babas home" detected — running welcome sequence.');
setKevosState('celebrate', 'SYSTEMS PRIMED. STANDING BY, SIR.');
document.querySelector('.wordmark__title').textContent = 'WELCOME HOME';
const flash = document.createElement('div');
flash.className = 'celebrate-flash';
document.body.appendChild(flash);
setTimeout(() => flash.remove(), 1400);
spawnStreakBurst(10);
sweepSpotlight();
speak('Welcome home, daddy.');
setTimeout(() => {
document.querySelector('.wordmark__title').textContent = 'KEVOS';
if (liveMode) setKevosState('listening', 'LISTENING...');
else if (wakeWordActive) enterStandby();
else setKevosState('idle');
}, 3400);
}
const micBtn = document.getElementById('micBtn');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
const WAKE_WORDS = ['hey kevos', 'kevos', 'hey kevin', 'okay kevos'];
let micAnalyser = null, micData = null;
async function ensureMicAnalyser() {
if (micAnalyser) return micAnalyser;
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const source = audioCtx.createMediaStreamSource(stream);
micAnalyser = audioCtx.createAnalyser();
micAnalyser.fftSize = 256;
micData = new Uint8Array(micAnalyser.frequencyBinCount);
source.connect(micAnalyser);
} catch (err) { micAnalyser = null; }
return micAnalyser;
}
function micVolume() {
if (!micAnalyser || !micData) return 0;
micAnalyser.getByteFrequencyData(micData);
let sum = 0;
for (let i = 0; i < micData.length; i++) sum += micData[i];
return Math.min(1, (sum / micData.length / 255) * 3.2);
}
function stripWakeWord(lowerText) {
for (const w of WAKE_WORDS) {
const idx = lowerText.indexOf(w);
if (idx !== -1) return lowerText.slice(idx + w.length).replace(/^[,.\s]+/, '').trim();
}
return null;
}
function restartAlwaysOnRecognition() {
if (!recognition) return;
try { recognition.start(); } catch (e) {}
}
if (SpeechRecognitionAPI) {
recognition = new SpeechRecognitionAPI();
recognition.lang = 'en-US';
recognition.interimResults = true;
recognition.addEventListener('result', (e) => {
const last = e.results[e.results.length - 1];
const transcript = last[0].transcript;
const isFinal = last.isFinal;
const state = currentState();
if ((liveMode || wakeWordActive) && state === 'speaking') {
stopSpeaking();
setKevosState('listening', 'LISTENING...');
if (isFinal && transcript.trim()) handleLiveTranscript(transcript.trim());
return;
}
if (wakeWordActive && !liveMode && state === 'standby') {
if (!isFinal) return;
if (checkEasterEgg(transcript)) return;
const remainder = stripWakeWord(transcript.toLowerCase());
if (remainder === null) return;
wakeConversation();
if (remainder) handleLiveTranscript(remainder);
else setKevosState('listening', 'LISTENING...');
return;
}
if (liveMode && isFinal) { handleLiveTranscript(transcript.trim()); return; }
if (!liveMode && !wakeWordActive && isFinal) { input.value = transcript; }
});
recognition.addEventListener('end', () => {
micBtn.classList.remove('active');
if ((liveMode || wakeWordActive) && !liveAwaitingReply) restartAlwaysOnRecognition();
});
recognition.addEventListener('error', (e) => {
micBtn.classList.remove('active');
if (liveMode || wakeWordActive) {
if (e.error === 'no-speech' || e.error === 'aborted') restartAlwaysOnRecognition();
else { logLine('error', `Mic error: ${e.error}.`); stopLiveMode(); stopWakeWord(); }
} else { logLine('error', 'Mic error — check microphone permission.'); }
});
micBtn.addEventListener('click', () => {
if (liveMode || wakeWordActive) return;
ensureMicAnalyser();
micBtn.classList.add('active');
recognition.start();
});
} else {
micBtn.disabled = true;
micBtn.title = 'Voice input not supported in this browser';
}
let voiceOutEnabled = true;
const voiceOutBtn = document.getElementById('voiceOutBtn');
let ttsStability = 0.5, ttsSimilarity = 0.75;

// Real audio analysis of KEVOS's own ElevenLabs voice as it plays — this is
// what drives the "shines brighter while talking" glow, genuinely reactive
// to the actual audio, not a guess.
let currentAudio = null;
let ttsAudioCtx = null, ttsAnalyser = null, ttsData = null;

function ttsVolume() {
if (!ttsAnalyser || !ttsData) return 0;
ttsAnalyser.getByteFrequencyData(ttsData);
let sum = 0;
for (let i = 0; i < ttsData.length; i++) sum += ttsData[i];
return Math.min(1, (sum / ttsData.length / 255) * 3.2);
}

function stopSpeaking() {
if (currentAudio) { currentAudio.pause(); currentAudio = null; }
}

function speakWithBrowserVoice(text) {
return new Promise((resolve) => {
if (!('speechSynthesis' in window)) { resolve(); return; }
window.speechSynthesis.cancel();
const utter = new SpeechSynthesisUtterance(text);
utter.onend = resolve;
utter.onerror = resolve;
window.speechSynthesis.speak(utter);
});
}

async function speak(text) {
if (!voiceOutEnabled) return;
stopSpeaking();
try {
const res = await fetch(KEVOS_TTS_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json', 'x-kevos-key': KEVOS_APP_KEY },
body: JSON.stringify({ text, stability: ttsStability, similarityBoost: ttsSimilarity }),
});
if (!res.ok) {
// ElevenLabs failed — usage limit hit, key issue, or their service is
// down. Rather than going silent, fall back to the browser's built-in
// voice so KEVOS still talks. Logged as 'system', not 'error', since
// this is expected/handled behavior, not something broken.
logLine('system', 'ElevenLabs unavailable (usage limit or error) — using backup voice.');
await speakWithBrowserVoice(text);
return;
}
const blob = await res.blob();
const url = URL.createObjectURL(blob);
const audio = new Audio(url);
currentAudio = audio;

if (!ttsAudioCtx) ttsAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
const source = ttsAudioCtx.createMediaElementSource(audio);
ttsAnalyser = ttsAudioCtx.createAnalyser();
ttsAnalyser.fftSize = 256;
ttsData = new Uint8Array(ttsAnalyser.frequencyBinCount);
source.connect(ttsAnalyser);
ttsAnalyser.connect(ttsAudioCtx.destination);

await new Promise((resolve) => {
audio.onended = () => { currentAudio = null; ttsAnalyser = null; URL.revokeObjectURL(url); resolve(); };
audio.onerror = () => { currentAudio = null; ttsAnalyser = null; URL.revokeObjectURL(url); resolve(); };
audio.play().catch(() => resolve());
});
} catch (err) {
// Network failure reaching our backend at all — same fallback applies.
logLine('system', 'Voice service unreachable — using backup voice.');
await speakWithBrowserVoice(text);
}
}
voiceOutBtn.addEventListener('click', () => {
voiceOutEnabled = !voiceOutEnabled;
voiceOutBtn.classList.toggle('active', voiceOutEnabled);
if (!voiceOutEnabled) stopSpeaking();
});
const composer = document.getElementById('composer');
const input = document.getElementById('input');
composer.addEventListener('submit', async (e) => {
e.preventDefault();
const text = input.value.trim();
if (!text) return;
input.value = '';
if (checkEasterEgg(text)) return;
logLine('user', text);
setKevosState('thinking', 'THINKING...');
const result = await sendToKevos(text);
logLine(result.ok ? 'system' : 'error', result.text);
if (result.ok && voiceOutEnabled) {
setKevosState('speaking', 'SPEAKING...');
await speak(result.text);
}
setKevosState('idle');
});
const liveOrb = document.getElementById('liveOrb');
let liveMode = false, liveAwaitingReply = false;
function startLiveListening() {
if (!liveMode || !recognition) return;
setKevosState('listening', 'LISTENING...');
restartAlwaysOnRecognition();
}
function stopLiveMode() {
liveMode = false; liveAwaitingReply = false;
liveOrb.classList.remove('active');
if (!wakeWordActive) setKevosState('idle');
if (recognition && !wakeWordActive) { try { recognition.stop(); } catch (e) {} }
stopSpeaking();
}
async function handleLiveTranscript(transcript) {
if (!transcript) { if (liveMode) startLiveListening(); return; }
if (checkEasterEgg(transcript)) return;
liveAwaitingReply = true;
logLine('user', transcript);
setKevosState('thinking', 'THINKING...');
const result = await sendToKevos(transcript);
logLine(result.ok ? 'system' : 'error', result.text);
const canSpeak = result.ok && voiceOutEnabled;
if (canSpeak) {
setKevosState('speaking', 'SPEAKING... (say anything to interrupt)');
restartAlwaysOnRecognition(); // keep mic live through playback so barge-in works
await speak(result.text); // waits for the ElevenLabs audio to actually finish
liveAwaitingReply = false;
if (liveMode) startLiveListening();
else if (wakeWordActive) enterStandby();
else setKevosState('idle');
} else {
liveAwaitingReply = false;
if (liveMode) startLiveListening();
else if (wakeWordActive) enterStandby();
else setKevosState('idle');
}
}
liveOrb.addEventListener('click', () => {
if (!SpeechRecognitionAPI) { logLine('error', 'Voice input not supported in this browser.'); return; }
if (liveMode) { stopLiveMode(); logLine('system', 'Live conversation ended.'); }
else {
ensureMicAnalyser();
liveMode = true;
liveOrb.classList.add('active');
logLine('system', 'Live conversation started — talk anytime, interrupt anytime.');
startLiveListening();
}
});
const wakeWordBtn = document.getElementById('wakeWordBtn');
let wakeWordActive = false;
function enterStandby() { setKevosState('standby', 'Say "Hey KEVOS"...'); restartAlwaysOnRecognition(); }
function wakeConversation() {
liveMode = true;
liveOrb.classList.add('active');
logLine('system', 'Wake word heard — KEVOS is listening.');
spawnStreakBurst(3);
sweepSpotlight();
}
function stopWakeWord() {
wakeWordActive = false;
wakeWordBtn.classList.remove('active');
if (!liveMode) { setKevosState('idle'); if (recognition) { try { recognition.stop(); } catch (e) {} } }
}
wakeWordBtn.addEventListener('click', () => {
if (!SpeechRecognitionAPI) { logLine('error', 'Voice input not supported in this browser.'); return; }
if (wakeWordActive) { stopWakeWord(); logLine('system', 'Wake word disabled.'); }
else {
ensureMicAnalyser();
wakeWordActive = true;
wakeWordBtn.classList.add('active');
logLine('system', 'Wake word enabled — say "Hey KEVOS" anytime.');
if (!liveMode) enterStandby();
}
});
const settingsPanel = document.getElementById('settingsPanel');
document.getElementById('settingsBtn').addEventListener('click', () => settingsPanel.classList.add('open'));
document.getElementById('settingsClose').addEventListener('click', () => settingsPanel.classList.remove('open'));
const stabilitySlider = document.getElementById('stabilitySlider');
const claritySlider = document.getElementById('claritySlider');
stabilitySlider.addEventListener('input', () => {
ttsStability = parseFloat(stabilitySlider.value);
document.getElementById('stabilityValue').textContent = ttsStability.toFixed(2);
});
claritySlider.addEventListener('input', () => {
ttsSimilarity = parseFloat(claritySlider.value);
document.getElementById('clarityValue').textContent = ttsSimilarity.toFixed(2);
});
document.getElementById('sphereToggle').addEventListener('change', (e) => {
canvas.style.display = e.target.checked ? '' : 'none';
});
document.getElementById('spotlightToggle').addEventListener('change', (e) => {
spotlightEnabled = e.target.checked;
if (!spotlightEnabled) spotlightBeam.classList.remove('on');
});
document.getElementById('clearMemoryBtn').addEventListener('click', () => {
localStorage.removeItem('kevos_session_id');
logLine('system', 'Memory reset locally. A fresh conversation starts next message.');
});
if ('serviceWorker' in navigator) {
window.addEventListener('load', () => {
navigator.serviceWorker.register('sw.js').catch(() => {});
});
}</script>
